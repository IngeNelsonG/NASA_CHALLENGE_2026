# Render Blueprint for the API (the frontend is on Vercel).
# Render → New → Blueprint → pick this repository. Secrets marked `sync: false` are asked for
# once in the dashboard and are never stored in the repository.
services:
  - type: web
    name: ember-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: true
    # redeploy only when the backend changes, not on every frontend commit
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: BRASA_ENVIRONMENT
        value: production
      - key: PORT
        value: "8000"
      # the Vercel site, plus its preview deployments and local development
      - key: BRASA_CORS_ALLOWED_ORIGINS
        value: '["https://nasachallenge2026.vercel.app","http://localhost:5173"]'
      - key: BRASA_CORS_ALLOWED_ORIGIN_REGEX
        value: 'https://nasachallenge2026(-[a-z0-9-]+)?\.vercel\.app'
      # fire points outside Colombia (live NASA FIRMS); without it only Colombia has points
      - key: BRASA_FIRMS_MAP_KEY
        sync: false
      # optional: AI wording for the help assistant (any OpenAI-compatible API, e.g. Groq)
      - key: BRASA_LLM_BASE_URL
        sync: false
      - key: BRASA_LLM_API_KEY
        sync: false
      - key: BRASA_LLM_MODEL
        sync: false
